name: Monorepo 容器镜像构建

on:
  push:
    branches: ['**']
    tags: ['v*', '*/v*', '*/*/v*']
  pull_request:
    branches: ['main', 'master']
  workflow_dispatch:
    inputs:
      directories:
        description: '要构建的目录（逗号分隔），留空则构建全部'
        required: false
        type: string
      force_all:
        description: '忽略变更检测，构建所有含 Dockerfile 的目录'
        type: boolean
        default: false
      push_images:
        description: '强制推送镜像（默认仅 push 事件时推送）'
        type: boolean
        default: false

env:
  # 目标 registry：ghcr.io（默认）/ docker.io / gitea.example.com
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
  # 镜像命名空间：默认取仓库 owner
  IMAGE_NAME: ${{ vars.IMAGE_NAME || github.repository_owner }}
  # registry 登录凭证
  REGISTRY_USER: ${{ vars.DOCKER_USER || github.actor }}
  REGISTRY_SECRET: ${{ secrets.DOCKER_PASSWORD || secrets.GITHUB_TOKEN }}

jobs:
  # 变更检测 — 找出哪些含 Dockerfile 的目录需要构建
  detect-changes:
    name: 变更检测
    runs-on: ubuntu-latest
    outputs:
      has-changes: ${{ steps.set-matrix.outputs.has-changes }}
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # tj-actions 全家桶有过供应链事件，用加固版 step-security 镜像（行为兼容）；
      # 自动排除 .gitignore 路径与 node_modules（vendor 未使用，无需排除）；
      # 直接返回 Dockerfile 文件路径（下游“匹配 → matrix”自行取 dirname）
      - name: 扫描 Dockerfile
        id: glob
        uses: step-security/tj-actions-glob@v22
        with:
          files: |
            **/Dockerfile

      # paths → /tmp/dockerfiles.json（相对路径，供“匹配 → matrix”步骤消费）
      - name: 整理 Dockerfile 列表
        id: discover
        run: |
          PATHS="${{ steps.glob.outputs.paths }}"
          if [[ -z "$PATHS" ]]; then
            echo "::warning::未找到任何 Dockerfile"
            echo "[]" > /tmp/dockerfiles.json
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # tj-actions/glob 输出相对路径；绝对路径兜底：剥掉 workspace 前缀
          PATHS="${PATHS//${GITHUB_WORKSPACE}\//}"
          printf '%s\n' $PATHS | jq -R . | jq -s -c . > /tmp/dockerfiles.json
          COUNT=$(jq length /tmp/dockerfiles.json)
          echo "找到 ${COUNT} 个 Dockerfile"
          for df in $(jq -r '.[]' /tmp/dockerfiles.json); do echo "  - $df"; done
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"

      - name: 变更检测 (push/PR)
        if: steps.discover.outputs.count != '0' && github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        id: changes
        with:
          list-files: json
          filters: |
            all:
              - '**'

      - name: 匹配 → matrix
        if: steps.discover.outputs.count != '0'
        id: set-matrix
        env:
          TRIGGER: ${{ github.event_name }}
          FORCE_ALL: ${{ inputs.force_all || false }}
          DISPATCH_DIRS: ${{ inputs.directories || '' }}
          CHANGED_FILES_JSON: ${{ steps.changes.outputs.all_files || '[]' }}
        run: |
          set -euo pipefail

          echo "::group::变更检测"

          mapfile -t ALL_DOCKERFILES < <(jq -r '.[]' /tmp/dockerfiles.json)
          echo "事件: ${TRIGGER}  |  Dockerfile: ${#ALL_DOCKERFILES[@]}"

          # workflow_dispatch 处理
          FORCE_ALL_BUILD=false

          if [[ "$TRIGGER" == "workflow_dispatch" ]]; then
            if [[ "$FORCE_ALL" == "true" ]]; then
              FORCE_ALL_BUILD=true
              echo "模式: force_all"
            elif [[ -n "$DISPATCH_DIRS" ]]; then
              IFS=',' read -ra DESIRED <<< "$DISPATCH_DIRS"
              FILTERED=()
              for d in "${DESIRED[@]}"; do
                d=$(echo "$d" | xargs)
                if [[ -f "$d/Dockerfile" ]]; then
                  FILTERED+=("$d/Dockerfile")
                else
                  echo "::warning::目录 '$d' 无 Dockerfile，跳过"
                fi
              done
              ALL_DOCKERFILES=("${FILTERED[@]}")
              FORCE_ALL_BUILD=true
              echo "模式: 指定目录 (${#FILTERED[@]})"
            else
              FORCE_ALL_BUILD=true
              echo "模式: 全部"
            fi
          fi

          # 解析变更文件列表 (来自 dorny/paths-filter)
          mapfile -t CHANGED_FILES < <(
            echo "$CHANGED_FILES_JSON" | jq -r '.[]?' 2>/dev/null || true
          )
          echo "变更文件: ${#CHANGED_FILES[@]}"

          # 匹配变更范围 + 生成 matrix（单次遍历）
          HAS_ANY=false
          INCLUDE_JSON="["
          FIRST=true

          for df in "${ALL_DOCKERFILES[@]}"; do
            if [[ ! -f "$df" ]]; then
              echo "  ⚠️  $df 已删除"
              continue
            fi

            dir_path="$(dirname "$df")"
            if [[ "$dir_path" == "." ]]; then
              scope_prefix=""
              norm_dir=""
            else
              scope_prefix="${dir_path}/"
              norm_dir="$dir_path"
            fi

            SHOULD_BUILD=false

            if [[ "$FORCE_ALL_BUILD" == "true" ]]; then
              SHOULD_BUILD=true
            elif [[ ${#CHANGED_FILES[@]} -gt 0 ]]; then
              for f in "${CHANGED_FILES[@]}"; do
                if [[ "$f" == "$scope_prefix"* ]] || [[ "$f" == "$df" ]]; then
                  SHOULD_BUILD=true
                  break
                fi
              done
            fi

            if [[ "$SHOULD_BUILD" == "true" ]]; then
              echo "  ✅ $df"
              HAS_ANY=true
              if [[ "$FIRST" != "true" ]]; then
                INCLUDE_JSON+=","
              fi
              INCLUDE_JSON+="{\"dockerfile\":\"${df}\",\"dir\":\"${norm_dir}\"}"
              FIRST=false
            else
              echo "  ⏭️  $df"
            fi
          done

          INCLUDE_JSON+="]"
          MATRIX_JSON=$(jq -nc --argjson inc "$INCLUDE_JSON" '{include: $inc}')

          echo ""
          echo "→ matrix: $MATRIX_JSON"
          echo "has-changes=${HAS_ANY}" >> "$GITHUB_OUTPUT"
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

  # 并行构建 & 推送 — matrix 消费 detect-changes 的输出
  build-and-push:
    name: "构建 & 推送 ${{ matrix.dir }}"
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: 镜像名
        id: image-path
        run: |
          REG="${{ env.REGISTRY }}"
          IMG="${{ env.IMAGE_NAME }}"
          DIR="${{ matrix.dir }}"

          if [[ -z "$DIR" ]]; then SUFFIX="${IMG}"; else SUFFIX="${IMG}/${DIR}"; fi

          # docker.io 不加 registry 前缀
          if [[ "$REG" == "docker.io" ]]; then FULL_IMAGE="${SUFFIX}"
          else FULL_IMAGE="${REG}/${SUFFIX}"; fi

          echo "full-image=${FULL_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "cache-image=${FULL_IMAGE}-buildcache" >> "$GITHUB_OUTPUT"
          echo "→ ${FULL_IMAGE}"

      - name: 标签 + 元数据
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image-path.outputs.full-image }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr
            type=match,pattern=(?:.*/)?v?(\d+\.\d+\.\d+),group=1
            type=match,pattern=(?:.*/)?v?(\d+\.\d+)\.\d+,group=1
            type=match,pattern=(?:.*/)?v?(\d+)\.\d+\.\d+,group=1
          flavor: |
            latest=auto

      - name: Registry 登录
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY == 'docker.io' && '' || env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_SECRET }}

      - name: Buildx
        uses: docker/setup-buildx-action@v4

      - name: 推送判定
        id: push-decision
        run: |
          EVENT="${{ github.event_name }}"
          MANUAL_PUSH="${{ inputs.push_images || false }}"

          if [[ "$EVENT" == "push" ]] || [[ "$MANUAL_PUSH" == "true" ]]; then
            echo "should-push=true" >> "$GITHUB_OUTPUT"
            echo "📤 推送"
          else
            echo "should-push=false" >> "$GITHUB_OUTPUT"
            echo "📦 仅构建"
          fi

      - name: 构建 & 推送
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.dir || '.' }}
          file: ${{ matrix.dockerfile }}
          push: ${{ steps.push-decision.outputs.should-push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.image-path.outputs.cache-image }}:cache
          cache-to: type=registry,ref=${{ steps.image-path.outputs.cache-image }}:cache,mode=max
          secrets: |
            "github_token=${{ secrets.GITHUB_TOKEN }}"