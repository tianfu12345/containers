name: 发布 Helm Charts（OCI）

# 独立于 release.yml（Docker 镜像）的 chart 发布流程：
# 手动触发 → 扫描所有含 Chart.yaml 的目录 → 版本号取自各 Chart.yaml 的 version
# 字段 → 目标仓库已存在同名 tag 的版本在矩阵生成时直接过滤
# → 只发布 OCI 格式（无 tgz 产物上传）。不打 git tag（避免与 Docker 镜像 tag 混淆）
#
# 依赖（charts/ 目录被 .gitignore 排除，不入库）每次构建时从 OCI 拉取重建。

on:
  workflow_dispatch:
    inputs:
      directories:
        description: '要发布的 chart 目录（逗号分隔，相对仓库根），留空则扫描全部含 Chart.yaml 的目录'
        required: false
        type: string

env:
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
  # 与 IMAGE_NAME 语义一致：仅定义存放路径（不含 REGISTRY），始终推送至 REGISTRY 之下；
  # 最终仓库路径 = OCI_CHART_REPO/<chart 名>。跨组织/跨仓库推送需对应权限的 PAT
  #（GITHUB_TOKEN 的 packages: write 仅覆盖本仓库）
  OCI_CHART_REPO: ${{ vars.OCI_CHART_REPO || format('{0}/helm-charts', github.repository_owner) }}
  REGISTRY_USER: ${{ vars.DOCKER_USER || github.actor }}
  REGISTRY_SECRET: ${{ secrets.DOCKER_PASSWORD || secrets.GITHUB_TOKEN }}

jobs:
  # ── 准备 matrix：扫描 Chart.yaml 目录 → 矩阵（含各 Chart.yaml 版本号）──
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read   # 重复版本探测（helm pull）
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # 加固版 step-security 镜像（tj-actions 全家桶有供应链事件）；自动排除 .gitignore 路径；
      # 返回 Chart.yaml 文件路径，目录在下一步取 dirname
      - name: 扫描 Chart.yaml
        id: glob
        uses: step-security/tj-actions-glob@v22
        with:
          files: |
            **/Chart.yaml

      - name: 安装 helm
        uses: azure/setup-helm@v4
        with:
          version: v3.22.0

      # 只读探测：GITHUB_TOKEN 的 packages: read 足够
      - name: helm 登录（探测）
        run: |
          echo "${{ env.REGISTRY_SECRET }}" | helm registry login "${{ env.REGISTRY }}" \
            --username "${{ env.REGISTRY_USER }}" --password-stdin

      # 组装矩阵：dir + 版本号（Chart.yaml 的 version 字段）；已发布版本（目标仓库已存在该 tag）在此过滤
      - name: 生成矩阵（过滤已发布）
        id: matrix
        env:
          DISPATCH_DIRS: ${{ inputs.directories || '' }}
        run: |
          if [[ -n "$DISPATCH_DIRS" ]]; then
            IFS=',' read -ra DIRS <<< "$DISPATCH_DIRS"
          else
            PATHS="${{ steps.glob.outputs.paths }}"
            if [[ -n "$PATHS" ]]; then
              for f in $PATHS; do
                DIRS+=("$(dirname "$f")")
              done
            fi
          fi

          INC_JSON="["
          FIRST=true
          for d in "${DIRS[@]}"; do
            if [[ ! -f "$d/Chart.yaml" ]]; then
              echo "::warning::跳过 '$d'：无 Chart.yaml"
              continue
            fi
            VER=$(grep -m1 '^version:' "$d/Chart.yaml" | awk '{print $2}' | tr -d '"')
            NAME=$(grep -m1 '^name:' "$d/Chart.yaml" | awk '{print $2}' | tr -d '"')
            if [[ -z "$VER" ]]; then
              echo "::warning::$d: Chart.yaml 无顶层 version 字段，跳过"
              continue
            fi
            if [[ -z "$NAME" ]]; then
              echo "::warning::$d: Chart.yaml 无 name 字段，跳过"
              continue
            fi

            # 重复版本探测：探测最终仓库路径 REGISTRY/OCI_CHART_REPO/<chart 名>
            REF="oci://${{ env.REGISTRY }}/${{ env.OCI_CHART_REPO }}/${NAME}"
            DEST=$(mktemp -d)
            if helm pull "$REF" --version "$VER" --destination "$DEST" >/dev/null 2>&1; then
              echo "::warning::$d v$VER 已存在于 $REF，从矩阵中过滤"
              continue
            fi

            if [[ "$FIRST" != "true" ]]; then INC_JSON+=","; fi
            INC_JSON+="{\"dir\":\"${d}\",\"version\":\"${VER}\"}"
            FIRST=false
          done
          INC_JSON+="]"

          if [[ "$INC_JSON" == "[]" ]]; then
            echo "::warning::没有可发布的 chart（全部已发布或无 Chart.yaml）"
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "matrix=$(jq -nc --argjson inc "$INC_JSON" '{include: $inc}')" >> "$GITHUB_OUTPUT"

  # ── 按目录并行发布：构建 → OCI 推送 ──
  release:
    needs: prepare
    if: needs.prepare.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # OCI 推送

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: 安装 helm
        uses: azure/setup-helm@v4
        with:
          version: v3.22.0   # 与 hermes-agent 镜像内版本一致

      # ── 计算 OCI 目标：push 给父仓库（REGISTRY + OCI_CHART_REPO），显示行给出
      # 最终路径（含 chart 名）──
      - name: 计算 OCI 目标
        id: target
        working-directory: ${{ matrix.dir }}
        run: |
          REG="${{ env.REGISTRY }}"
          BASE="${{ env.OCI_CHART_REPO }}"
          TAG="${{ matrix.version }}"
          NAME=$(grep -m1 '^name:' Chart.yaml | awk '{print $2}' | tr -d '"')
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "chart-name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "oci-ref=oci://${REG}/${BASE}" >> "$GITHUB_OUTPUT"
          echo "→ oci://${REG}/${BASE}/${NAME}:${TAG}"

      - name: helm 登录
        run: |
          echo "${{ env.REGISTRY_SECRET }}" | helm registry login "${{ env.REGISTRY }}" \
            --username "${{ env.REGISTRY_USER }}" --password-stdin

      # ── 构建并发布：charts/ 不入库，构建时拉取重建；渲染为空即中止（骨架问题）；──
      # tgz 仅作 OCI 推送中间产物，不上传
      - name: 构建并发布 OCI chart
        run: |
          echo "== 拉取依赖 =="
          helm dependency build .
          echo "== lint =="
          helm lint .
          echo "== 渲染完整性检查 =="
          COUNT=$(helm template sanity . --namespace default | grep -cE '^kind:')
          echo "渲染对象数: $COUNT"
          [ "$COUNT" -ge 1 ] || { echo "::error::渲染为空（骨架或依赖问题），中止发布"; exit 1; }
          echo "== 打包 =="
          mkdir -p dist
          helm package . --destination dist/
          echo "== 发布 =="
          helm push dist/*.tgz "${{ steps.target.outputs.oci-ref }}"
          echo "✅ ${{ matrix.dir }} v${{ matrix.version }} 已发布到 ${{ steps.target.outputs.oci-ref }}/${{ steps.target.outputs.chart-name }}:${{ matrix.version }}"
        working-directory: ${{ matrix.dir }}
